server {
    listen 80;
    server_name _;
    root /var/www/librecad;
    index librecad.html;

    # Wasm MIME type (critical)
    types {
        application/wasm wasm;
        text/html html;
        application/javascript js;
        text/css css;
        image/svg+xml svg;
        application/octet-stream data;
    }

    # Pre-compressed assets: prefer Brotli, fall back to gzip
    gzip_static on;
    gzip_proxied any;

    # Brotli (requires nginx-brotli module)
    # brotli_static on;

    # Long-cache immutable assets (hash-based names would be better)
    location ~* \.(wasm|js|data|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML shell: never cache (always fetch latest)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # COOP/COEP headers (optional — enables SharedArrayBuffer for future threading)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
}
